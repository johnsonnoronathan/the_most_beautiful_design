<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>A day of light</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400;1,400&amp;family=Geist:wght@200;300;400;500&amp;family=Geist+Mono:wght@400&amp;display=swap">
<style>
body{margin:0}
a{color:#FFCB8E}a:hover{color:#FFF1E2}
button{font-family:inherit;cursor:pointer}
@keyframes hr-tw{0%,100%{opacity:1}50%{opacity:.3}}
.hr-tw1{animation:hr-tw 4.6s ease-in-out infinite}
.hr-tw2{animation:hr-tw 6.2s ease-in-out 1.7s infinite}
</style>
</helmet>
<div style="position: relative; width: 1440px; height: 900px; overflow: hidden; background: {{nearCol}}; color: #FFF4E6; font-family: 'Geist', sans-serif">

<svg width="1440" height="900" viewBox="0 0 1440 900" aria-hidden="true" style="position: absolute; left: 0; top: 0; display: block">
<defs>
<linearGradient id="hr-sky" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="{{skyTop}}"></stop>
<stop offset="0.5" stop-color="{{skyMid}}"></stop>
<stop offset="0.82" stop-color="{{skyLow}}"></stop>
<stop offset="1" stop-color="{{horizon}}"></stop>
</linearGradient>
<radialGradient id="hr-glow" cx="0.5" cy="0.5" r="0.5">
<stop offset="0" stop-color="{{sunCol}}" stop-opacity="0.85"></stop>
<stop offset="0.3" stop-color="{{sunCol}}" stop-opacity="0.3"></stop>
<stop offset="1" stop-color="{{sunCol}}" stop-opacity="0"></stop>
</radialGradient>
<linearGradient id="hr-mist" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="{{horizon}}" stop-opacity="0"></stop>
<stop offset="0.5" stop-color="{{horizon}}" stop-opacity="0.26"></stop>
<stop offset="1" stop-color="{{horizon}}" stop-opacity="0"></stop>
</linearGradient>
</defs>

<rect x="0" y="0" width="1440" height="600" fill="url(#hr-sky)"></rect>

<g fill="#FFF4E4" opacity="{{starO}}">
<path d="{{stars0}}" opacity="0.9"></path>
<path class="hr-tw1" d="{{stars1}}"></path>
<path class="hr-tw2" d="{{stars2}}"></path>
</g>

<circle cx="{{moonX}}" cy="{{moonY}}" r="54" fill="#F4EEE2" opacity="{{moonHalo}}"></circle>
<circle cx="{{moonX}}" cy="{{moonY}}" r="18" fill="#F4EEE2" opacity="{{moonO}}"></circle>

<circle cx="{{sunX}}" cy="{{sunY}}" r="620" fill="url(#hr-glow)" opacity="{{glowO}}"></circle>
<circle cx="{{sunX}}" cy="{{sunY}}" r="42" fill="{{sunCol}}"></circle>

<path d="{{r0.d}}" fill="{{r0.fill}}"></path>
<path d="{{r1.d}}" fill="{{r1.fill}}"></path>
<path d="{{r2.d}}" fill="{{r2.fill}}"></path>
<rect x="0" y="{{m2}}" width="1440" height="90" fill="url(#hr-mist)"></rect>
<path d="{{r3.d}}" fill="{{r3.fill}}"></path>
<path d="{{r4.d}}" fill="{{r4.fill}}"></path>
<path d="{{r5.d}}" fill="{{r5.fill}}"></path>
<rect x="0" y="{{m5}}" width="1440" height="90" fill="url(#hr-mist)"></rect>
<path d="{{r6.d}}" fill="{{r6.fill}}"></path>
<path d="{{r7.d}}" fill="{{r7.fill}}"></path>
<path d="{{r8.d}}" fill="{{r8.fill}}"></path>
<rect x="0" y="{{m8}}" width="1440" height="90" fill="url(#hr-mist)" opacity="0.7"></rect>
<path d="{{r9.d}}" fill="{{r9.fill}}"></path>
<path d="{{r10.d}}" fill="{{r10.fill}}"></path>
<path d="{{r11.d}}" fill="{{r11.fill}}"></path>
<rect x="0" y="{{m11}}" width="1440" height="90" fill="url(#hr-mist)" opacity="0.45"></rect>
<path d="{{r12.d}}" fill="{{r12.fill}}"></path>
<path d="{{r13.d}}" fill="{{r13.fill}}"></path>
<path d="{{r14.d}}" fill="{{r14.fill}}"></path>
<path d="{{r15.d}}" fill="{{r15.fill}}"></path>
<path d="{{r16.d}}" fill="{{r16.fill}}"></path>
<path d="{{r17.d}}" fill="{{r17.fill}}"></path>
<rect x="0" y="790" width="1440" height="110" fill="{{nearCol}}"></rect>
</svg>

<div style="position: absolute; left: 64px; right: 64px; top: 48px; display: flex; justify-content: space-between; align-items: flex-start; gap: 48px">
<div style="display: flex; flex-direction: column; gap: 12px">
<span style="font-family: 'Geist Mono', monospace; font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; color: #FFF4E6; opacity: 0.8">A day over one valley</span>
<h1 style="margin: 0; font-family: 'Bodoni Moda', serif; font-style: italic; font-weight: 400; font-size: 120px; line-height: 1; letter-spacing: -0.03em; color: #FFF4E6">{{phase}}</h1>
<p style="margin: 0; max-width: 420px; font-size: 19px; font-weight: 300; line-height: 1.45; color: #FFF4E6">{{note}}</p>
</div>
<div style="display: flex; flex-direction: column; align-items: flex-end; gap: 6px">
<span style="font-size: 96px; font-weight: 200; line-height: 1; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; color: #FFF4E6">{{clock}}</span>
<span style="font-family: 'Geist Mono', monospace; font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; color: #FFF4E6; opacity: 0.8">{{sunLabel}}</span>
</div>
</div>

<div style="position: absolute; left: 64px; right: 64px; bottom: 34px; display: flex; align-items: center; gap: 28px">
<button onClick="{{togglePlay}}" aria-label="{{playLabel}}" style="flex-shrink: 0; width: 56px; height: 56px; display: flex; align-items: center; justify-content: center; border-radius: 28px; border: 1px solid rgba(255,244,230,0.45); background: transparent; color: #FFF4E6">
<sc-if value="{{playing}}" hint-placeholder-val="{{ false }}">
<svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><rect x="3" y="2" width="4" height="14" rx="1" fill="currentColor"></rect><rect x="11" y="2" width="4" height="14" rx="1" fill="currentColor"></rect></svg>
</sc-if>
<sc-if value="{{paused}}" hint-placeholder-val="{{ true }}">
<svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M5 2.5 L15 9 L5 15.5 Z" fill="currentColor"></path></svg>
</sc-if>
</button>

<div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 6px">
<label for="hr-time" style="font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: #CFC6C2">Time of day</label>
<input id="hr-time" type="range" min="0" max="24" step="0.05" value="{{hour}}" onChange="{{scrub}}" style="width: 100%; margin: 0; accent-color: {{sunCol}}">
<div style="display: flex; justify-content: space-between; font-family: 'Geist Mono', monospace; font-size: 11px; color: #CFC6C2">
<span>00</span><span>03</span><span>06</span><span>09</span><span>12</span><span>15</span><span>18</span><span>21</span><span>24</span>
</div>
</div>

<div style="display: flex; gap: 8px; flex-shrink: 0">
<sc-for list="{{presets}}" as="p" hint-placeholder-count="5">
<sc-if value="{{p.on}}" hint-placeholder-val="{{ false }}">
<button onClick="{{p.go}}" aria-pressed="true" style="height: 44px; padding: 0 18px; border-radius: 22px; border: 1px solid #FFF4E6; background: #FFF4E6; color: #0A0814; font-size: 14px; font-weight: 500">{{p.label}}</button>
</sc-if>
<sc-if value="{{p.off}}" hint-placeholder-val="{{ true }}">
<button onClick="{{p.go}}" aria-pressed="false" style="height: 44px; padding: 0 18px; border-radius: 22px; border: 1px solid rgba(255,244,230,0.35); background: transparent; color: #FFF4E6; font-size: 14px; font-weight: 400">{{p.label}}</button>
</sc-if>
</sc-for>
</div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"startHour":{"editor":"range","default":19.3,"min":0,"max":24,"step":0.1,"section":"Scene"},"seed":{"editor":"int","default":7,"min":1,"max":999,"section":"Scene"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  rng(seed) {
    let a = seed | 0;
    return function () {
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  hex(h) {
    const n = parseInt(h.slice(1), 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }

  mix(a, b, t) {
    const A = this.hex(a), B = this.hex(b);
    return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join('');
  }

  ridges(seed, W, H, horizon, floor) {
    const rnd = this.rng(seed);
    const k = (floor - horizon) / 440;
    const n = 18, step = 6, out = [];
    for (let i = 0; i < n; i++) {
      const t = i / (n - 1);
      const base = horizon + 6 + Math.pow(t, 1.7) * (floor - horizon);
      const amp = (36 - 26 * t + 150 * Math.pow(t, 1.25)) * k;
      const w = [];
      for (let j = 0; j < 5; j++) w.push({ f: (0.0035 + rnd() * 0.004) * Math.pow(1.95, j), p: rnd() * 6.2832, a: Math.pow(0.5, j) });
      const rp = rnd() * 6.2832;
      let d = 'M0,' + H;
      for (let x = 0; x <= W + step; x += step) {
        let v = 0;
        for (const q of w) v += q.a * Math.sin(x * q.f + q.p);
        v = v * 0.75 + (1 - Math.abs(Math.sin(x * w[0].f * 0.8 + rp))) * 0.6;
        d += 'L' + x + ',' + (base - amp * (v + 1) * 0.5).toFixed(1);
      }
      d += 'L' + (W + step) + ',' + H + 'Z';
      out.push({ d, t, base });
    }
    return out;
  }

  stars(seed, W, maxY, count) {
    const rnd = this.rng(seed * 31 + 7);
    const g = ['', '', ''];
    for (let i = 0; i < count; i++) {
      const x = rnd() * W;
      const y = Math.pow(rnd(), 1.5) * maxY;
      const r = 0.35 + Math.pow(rnd(), 3) * 1.6;
      const rs = r.toFixed(2), d = (2 * r).toFixed(2);
      g[i % 3] += 'M' + (x - r).toFixed(1) + ',' + y.toFixed(1) + 'a' + rs + ',' + rs + ' 0 1,0 ' + d + ',0a' + rs + ',' + rs + ' 0 1,0 -' + d + ',0';
    }
    return g;
  }

  keys() {
    const night = { skyTop: '#03040C', skyMid: '#0A1130', skyLow: '#16224A', horizon: '#25335E', far: '#283458', near: '#03050B', sun: '#FFB06A', starO: 1, glowO: 0 };
    return [
      Object.assign({ h: 0 }, night),
      { h: 4.6, skyTop: '#070B22', skyMid: '#1E2456', skyLow: '#5A4A84', horizon: '#C98A8E', far: '#4F4775', near: '#080A16', sun: '#FFB06A', starO: 0.7, glowO: 0.12 },
      { h: 6, skyTop: '#2A3A78', skyMid: '#7F78B0', skyLow: '#F0A98C', horizon: '#FFD3A1', far: '#9C88AE', near: '#16152A', sun: '#FFC27A', starO: 0.08, glowO: 0.75 },
      { h: 8.5, skyTop: '#3C78C4', skyMid: '#86B6E2', skyLow: '#CFE2F0', horizon: '#F6EAD6', far: '#A3B9CF', near: '#22323F', sun: '#FFF6E4', starO: 0, glowO: 0.45 },
      { h: 12.5, skyTop: '#2762C4', skyMid: '#6FA8EA', skyLow: '#B8DAF6', horizon: '#E6F3FC', far: '#AFC6DB', near: '#1C3236', sun: '#FFFFFF', starO: 0, glowO: 0.35 },
      { h: 16.5, skyTop: '#3767AE', skyMid: '#8FA6C8', skyLow: '#F1C38E', horizon: '#FFDCA4', far: '#C9A188', near: '#261C20', sun: '#FFD08A', starO: 0, glowO: 0.75 },
      { h: 18, skyTop: '#1B2158', skyMid: '#6A4A86', skyLow: '#E9805E', horizon: '#FFB873', far: '#B66F86', near: '#120D1C', sun: '#FFB06A', starO: 0.05, glowO: 0.95 },
      { h: 19.3, skyTop: '#0A0D2C', skyMid: '#33285A', skyLow: '#A2506A', horizon: '#F08A5D', far: '#9A5C7E', near: '#0A0814', sun: '#FFB06A', starO: 0.45, glowO: 0.5 },
      { h: 20.8, skyTop: '#050822', skyMid: '#141C4A', skyLow: '#2F3A78', horizon: '#5B5E98', far: '#363C6C', near: '#05060F', sun: '#FFB06A', starO: 0.85, glowO: 0.08 },
      Object.assign({ h: 24 }, night)
    ];
  }

  paletteAt(h) {
    const K = this._keys || (this._keys = this.keys());
    let i = 0;
    while (i < K.length - 2 && h > K[i + 1].h) i++;
    const a = K[i], b = K[i + 1];
    let t = Math.min(1, Math.max(0, (h - a.h) / (b.h - a.h)));
    t = t * t * (3 - 2 * t);
    const p = {};
    ['skyTop', 'skyMid', 'skyLow', 'horizon', 'far', 'near', 'sun'].forEach((k) => { p[k] = this.mix(a[k], b[k], t); });
    p.starO = a.starO + (b.starO - a.starO) * t;
    p.glowO = a.glowO + (b.glowO - a.glowO) * t;
    return p;
  }

  phaseAt(h) {
    const P = [
      [4.5, 'Night', 'Stars, and the valley asleep.'],
      [5.8, 'First light', 'The sky pales before anything else does.'],
      [7, 'Sunrise', 'Light finds the far ridges first.'],
      [11, 'Morning', 'Mist lifts out of the low places.'],
      [14, 'Noon', 'Short shadows under the bluest sky.'],
      [16.2, 'Afternoon', 'Everything warms by a shade.'],
      [17.8, 'Golden hour', 'Low sun, long light, soft edges.'],
      [18.6, 'Sunset', 'The sun meets the ridgeline.'],
      [20.2, 'Afterglow', 'The sky keeps burning after the fire is out.'],
      [21.5, 'Blue hour', 'Cold light, and the first stars.'],
      [24.01, 'Night', 'Stars, and the valley asleep.']
    ];
    for (const ph of P) if (h < ph[0]) return ph;
    return P[P.length - 1];
  }

  s() {
    return Object.assign({ hour: this.props.startHour ?? 19.3, playing: false }, this.state || {});
  }

  componentDidMount() {
    this.timer = setInterval(() => {
      const s = this.s();
      if (s.playing) this.setState({ hour: (s.hour + 0.035) % 24 });
    }, 50);
  }

  componentWillUnmount() {
    clearInterval(this.timer);
  }

  renderVals() {
    const seed = this.props.seed ?? 7;
    const W = 1440, horizon = 560;
    if (this._seed !== seed) {
      this._seed = seed;
      this._ridges = this.ridges(seed, W, 900, horizon, 770);
      this._stars = this.stars(seed, W, 500, 300);
    }
    const s = this.s();
    const h = s.hour;
    const p = this.paletteAt(h);
    const v = {};
    this._ridges.forEach((r, i) => { v['r' + i] = { d: r.d, fill: this.mix(p.far, p.near, Math.pow(r.t, 0.7)) }; });
    [2, 5, 8, 11].forEach((i) => { v['m' + i] = Math.round(this._ridges[i].base - 55); });

    const e = Math.sin(Math.PI * (h - 6) / 12);
    const hm = (h + 12) % 24;
    const em = Math.sin(Math.PI * (hm - 6) / 12);
    const moonVis = em > 0 ? Math.min(1, em * 4) * Math.min(1, p.starO * 1.2 + 0.15) : 0;
    const ph = this.phaseAt(h);
    const hh = Math.floor(h) % 24;
    const mm = Math.floor((h - Math.floor(h)) * 60);
    const deg = Math.round(e * 62);

    return Object.assign(v, {
      hour: h,
      playing: s.playing,
      paused: !s.playing,
      playLabel: s.playing ? 'Pause time-lapse' : 'Play time-lapse',
      skyTop: p.skyTop, skyMid: p.skyMid, skyLow: p.skyLow, horizon: p.horizon,
      sunCol: p.sun, nearCol: p.near, starO: p.starO.toFixed(3), glowO: p.glowO.toFixed(3),
      sunX: (120 + 1200 * ((h - 6) / 12)).toFixed(1),
      sunY: (horizon - e * (horizon - 110)).toFixed(1),
      moonX: (120 + 1200 * ((hm - 6) / 12)).toFixed(1),
      moonY: (horizon - em * (horizon - 150)).toFixed(1),
      moonO: moonVis.toFixed(3),
      moonHalo: (moonVis * 0.06).toFixed(3),
      stars0: this._stars[0], stars1: this._stars[1], stars2: this._stars[2],
      phase: ph[1],
      note: ph[2],
      clock: String(hh).padStart(2, '0') + ':' + String(mm).padStart(2, '0'),
      sunLabel: deg >= 0 ? 'Sun ' + deg + '° above the ridge' : 'Sun ' + Math.abs(deg) + '° below the ridge',
      togglePlay: () => this.setState({ playing: !this.s().playing }),
      scrub: (ev) => this.setState({ hour: parseFloat(ev.target.value), playing: false }),
      presets: [['First light', 5.3], ['Noon', 12.5], ['Golden hour', 17], ['Afterglow', 19.3], ['Night', 23]].map((q) => {
        const on = Math.abs(h - q[1]) < 0.35;
        return { label: q[0], on, off: !on, go: () => this.setState({ hour: q[1], playing: false }) };
      })
    });
  }
}
</script>
</body>
</html>
