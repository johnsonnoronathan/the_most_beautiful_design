<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ma — Timer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@200;300;400;500&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<link rel="stylesheet" href="frame.css">
<style>
  #board button { font-family: inherit; cursor: pointer; }
  .pill { flex: 1 1 0; height: 48px; border-radius: 24px; font-size: 16px; border: 1px solid rgba(242, 241, 236, 0.28); background: transparent; color: #F2F1EC; font-weight: 400; }
  .pill[aria-pressed='true'] { border-color: #F2F1EC; background: #F2F1EC; color: #11151B; font-weight: 500; }
  #ring { transition: stroke-dashoffset 1s linear; }
  @media (prefers-reduced-motion: reduce) { #ring { transition: none; } }
</style>
</head>
<body>
<header class="bar">
  <nav class="crumbs" aria-label="Breadcrumb"><a href="index.html">Ma 間</a><span class="here">Timer app · 390 × 844 · working</span></nav>
  <div class="tools"><span>Sun</span><span id="swatches" style="display: flex; gap: 8px"></span></div>
</header>
<main class="room">
  <div class="stage" style="border-radius: 28px">
    <div id="board" class="board" style="width: 390px; height: 844px; box-sizing: border-box; padding: 20px 24px 28px; display: flex; flex-direction: column; background: #11151B; color: #F2F1EC; font-family: 'Hanken Grotesk', sans-serif">

      <div style="display: flex; justify-content: space-between; align-items: center; height: 44px">
        <span style="font-size: 22px; font-weight: 400; letter-spacing: -0.01em">Ma <span style="font-weight: 200; color: #A3A6A8" lang="ja">間</span></span>
        <button type="button" aria-label="Settings" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 22px; background: transparent; color: #A3A6A8">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><line x1="4" y1="7" x2="20" y2="7"></line><line x1="4" y1="17" x2="20" y2="17"></line><circle cx="9" cy="7" r="2.2" fill="#11151B"></circle><circle cx="15" cy="17" r="2.2" fill="#11151B"></circle></svg>
        </button>
      </div>

      <div style="position: relative; width: 280px; height: 280px; align-self: center; margin-top: 52px">
        <svg id="dial" width="280" height="280" viewBox="0 0 280 280" role="img" aria-label="10 minutes remaining">
          <circle cx="140" cy="140" r="130" fill="none" stroke="rgba(242,241,236,0.12)" stroke-width="2"></circle>
          <circle id="ring" cx="140" cy="140" r="130" fill="none" stroke="var(--sun)" stroke-width="3" stroke-linecap="round" stroke-dasharray="816.81" stroke-dashoffset="816.81" transform="rotate(-90 140 140)"></circle>
        </svg>
        <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px">
          <span id="clock" aria-live="off" style="font-size: 76px; font-weight: 200; letter-spacing: -0.03em; line-height: 1; font-variant-numeric: tabular-nums">10:00</span>
          <span id="status" style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: #A3A6A8">remaining</span>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; margin-top: 44px; text-align: center">
        <span style="font-size: 26px; font-weight: 300; letter-spacing: -0.01em">Sit. Do nothing.</span>
        <span style="font-size: 16px; font-weight: 300; color: #A3A6A8">Let the minutes be empty.</span>
      </div>

      <div style="flex-grow: 1"></div>

      <div style="display: flex; flex-direction: column; gap: 12px">
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: #A3A6A8">Duration</span>
        <div id="durations" style="display: flex; gap: 10px"></div>
      </div>

      <button id="primary" type="button" style="margin-top: 20px; height: 56px; border: 0; border-radius: 28px; background: var(--sun); color: #11151B; font-size: 17px; font-weight: 500; letter-spacing: 0.01em">Begin</button>
      <button id="reset" type="button" style="margin-top: 6px; height: 44px; border: 0; background: transparent; color: #A3A6A8; font-size: 15px; font-weight: 400">Reset</button>

    </div>
  </div>
</main>
<script src="frame.js"></script>
<script>
  const board = document.getElementById('board');
  sunSwatches(document.getElementById('swatches'), board);
  fitBoard(board, 390, 844);

  const C = 816.81;
  const state = {minutes: 10, left: 600, running: false};
  const el = (id) => document.getElementById(id);

  [5, 10, 20].forEach((m) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'pill';
    b.textContent = `${m} min`;
    b.dataset.minutes = m;
    b.addEventListener('click', () => {
      Object.assign(state, {minutes: m, left: m * 60, running: false});
      render();
    });
    el('durations').appendChild(b);
  });

  el('primary').addEventListener('click', () => {
    if (state.left === 0) Object.assign(state, {left: state.minutes * 60, running: true});
    else state.running = !state.running;
    render();
  });
  el('reset').addEventListener('click', () => {
    Object.assign(state, {left: state.minutes * 60, running: false});
    render();
  });

  setInterval(() => {
    if (!state.running) return;
    state.left = Math.max(0, state.left - 1);
    state.running = state.left > 0;
    render();
  }, 1000);

  function render() {
    const total = state.minutes * 60;
    const started = state.left < total;
    const mm = Math.floor(state.left / 60);
    const ss = String(state.left % 60).padStart(2, '0');
    el('clock').textContent = `${mm}:${ss}`;
    el('ring').setAttribute('stroke-dashoffset', (C * (state.left / total)).toFixed(2));
    el('dial').setAttribute('aria-label', `${mm} minutes ${ss} seconds remaining`);
    el('primary').textContent = state.running ? 'Pause' : state.left === 0 ? 'Again' : started ? 'Resume' : 'Begin';
    el('status').textContent = state.running ? 'breathe' : state.left === 0 ? 'well done' : started ? 'paused' : 'remaining';
    document.querySelectorAll('.pill').forEach((p) => p.setAttribute('aria-pressed', String(Number(p.dataset.minutes) === state.minutes)));
  }
  render();
</script>
</body>
</html>
